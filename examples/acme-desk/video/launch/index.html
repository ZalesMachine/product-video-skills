<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Acme Desk · launch</title>
    <!-- Default tokens, then the product's (brand.css, generated by video/capture/capture.mjs), then the shared language. -->
    <link rel="stylesheet" href="assets/lib/theme.css" />
    <link rel="stylesheet" href="assets/brand/brand.css" />
    <link rel="stylesheet" href="assets/lib/pv.css" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <!-- Language, music grid and captures: written by video/render.mjs -->
    <script src="assets/lang.js"></script>
    <script src="assets/music.js"></script>
    <script src="assets/i18n.js"></script>
    <script src="assets/screens/current/screens.js"></script>
    <script src="assets/lib/pv.js"></script>
    <style>
      @font-face { font-family: 'Space Grotesk'; src: url('assets/lib/fonts/space-grotesk.woff2') format('woff2'); font-weight: 300 700; font-display: block; }
      @font-face { font-family: 'JetBrains Mono'; src: url('assets/lib/fonts/jetbrains-mono.woff2') format('woff2'); font-weight: 400 500; font-display: block; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: var(--pv-ground); }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: var(--pv-ground); font-family: 'Space Grotesk', system-ui, sans-serif; }
      #root > div[data-composition-src] { position: absolute; inset: 0; }
    </style>
  </head>
  <body>
    <!--
      Scenes in beats of the music. Start of scene N = first_downbeat + beat × (60 / BPM), with three
      decimals; the hook starts at 0 with the track. Duration = beats × (60 / BPM).
      See STORYBOARD.md. At 100 BPM (beat = 0.6 s, downbeat 0):
        hook        0–16   → start 0.000   dur 9.600
        dashboard   16–28  → start 9.600   dur 7.200
        tickets     28–40  → start 16.800  dur 7.200
        finale      40–60  → start 24.000  dur 12.000
      The root lasts until the end of the last scene.
    -->
    <div id="root" data-composition-id="main" data-width="1920" data-height="1080" data-duration="36.000">
      <div id="el-hook" data-composition-id="hook" data-composition-src="compositions/hook.html" data-start="0.000" data-duration="9.600" data-track-index="1" data-width="1920" data-height="1080"></div>
      <div id="el-dashboard" data-composition-id="dashboard" data-composition-src="compositions/dashboard.html" data-start="9.600" data-duration="7.200" data-track-index="1" data-width="1920" data-height="1080"></div>
      <div id="el-tickets" data-composition-id="tickets" data-composition-src="compositions/tickets.html" data-start="16.800" data-duration="7.200" data-track-index="1" data-width="1920" data-height="1080"></div>
      <div id="el-finale" data-composition-id="finale" data-composition-src="compositions/finale.html" data-start="24.000" data-duration="12.000" data-track-index="1" data-width="1920" data-height="1080"></div>
      <audio id="music" data-timeline-role="music" src="assets/audio/music.mp3" data-start="0" data-media-start="0" data-duration="36.000" data-track-index="10" data-volume="0.9" data-fade-out="2"></audio>
    </div>
    <script>
      window.__timelines['main'] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
